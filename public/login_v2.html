<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Mobile Key Fob Pro</title>
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            alert('JavaScript Error: ' + msg + '\nLine: ' + lineNo);
            return false;
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-800 flex items-center justify-center min-h-screen p-6 font-sans">

    <div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full">
        <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">Admin Portal Login</h2>
        <p class="text-slate-500 text-center text-sm mb-6">Enter your credentials to access dispatch management.</p>

        <form id="login-form" onsubmit="event.preventDefault();" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="admin@keyfobpro.com" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            
            <button type="button" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">Sign In</button>
        </form>

        <div id="debug-log" class="mt-4 p-3 bg-slate-100 rounded text-xs font-mono text-slate-700 overflow-x-auto">Ready.</div>
        <p id="error-msg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
    </div>

    <script>
        // 1. Initialize Supabase Client (named supabaseClient to avoid collision with global supabase library)
        let supabaseClient = null;
        try {
            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient('https://mdlprbqvdthlxvqgsxeb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kbHByYnF2ZHRobHh2cWdzeGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MDE1ODUsImV4cCI6MjEwMzE3NzU4NX0.y6mARxfENJy07waRztwluL7HIyv9LbVbOqiQVR--di4');
            }
        } catch (e) {
            alert("Supabase init error: " + e.message);
        }

        // 2. Check existing session
        async function checkExistingSession() {
            if (!supabaseClient || !supabaseClient.auth) return;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {}
        }
        checkExistingSession();

        // 3. Handle Login function
        async function handleLogin() {
            const dbg = document.getElementById('debug-log');
            function log(msg) {
                console.log(msg);
                if (dbg) dbg.textContent = msg;
            }

            try {
                log("1. Button clicked...");
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                const errorMsg = document.getElementById('error-msg');
                const loginBtn = document.getElementById('login-btn');

                const email = emailInput ? emailInput.value.trim() : '';
                const password = passwordInput ? passwordInput.value.trim() : '';

                if (!email || !password) {
                    log("Error: Missing email or password.");
                    alert("Please enter both email and password.");
                    return;
                }

                log("2. Authenticating " + email + "...");
                if (loginBtn) {
                    loginBtn.disabled = true;
                    loginBtn.textContent = 'Signing in...';
                }

                if (!supabaseClient || !supabaseClient.auth) {
                    log("Error: Supabase client not initialized.");
                    alert('Connection error: Could not connect to Supabase.');
                    if (loginBtn) { loginBtn.disabled = false; loginBtn.textContent = 'Sign In'; }
                    return;
                }

                log("3. Calling Supabase signInWithPassword...");
                const authPromise = supabaseClient.auth.signInWithPassword({ email, password });
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('Sign in timed out.')), 6000)
                );

                const result = await Promise.race([authPromise, timeoutPromise]);

                if (result && result.error) {
                    log("Supabase Error: " + result.error.message);
                    alert("Login Error: " + result.error.message);
                    if (loginBtn) { loginBtn.disabled = false; loginBtn.textContent = 'Sign In'; }
                } else if (result && result.data && result.data.session) {
                    log("4. Login success! Redirecting to dashboard...");
                    await new Promise(r => setTimeout(r, 400));
                    window.location.href = 'dashboard.html';
                } else {
                    log("Error: No session returned from Supabase.");
                    alert("Login failed: " + JSON.stringify(result));
                    if (loginBtn) { loginBtn.disabled = false; loginBtn.textContent = 'Sign In'; }
                }
            } catch (err) {
                log("Exception: " + err.message);
                alert("CRITICAL EXCEPTION: " + err.message);
                const loginBtn = document.getElementById('login-btn');
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            }
        }

        // 4. Attach click listener after DOM loads
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('login-btn');
            if (btn) btn.addEventListener('click', handleLogin);
        });
    </script>
</body>
</html>
